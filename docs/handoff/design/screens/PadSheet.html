<style>
body{margin:0;background:#0A0A0C}
a{color:#F4F4F5}a:hover{color:#FFFFFF}

    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="padprompt" style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8E9AB3">Sound prompt</label>
      <textarea id="padprompt" rows="2" style="resize: none; border-radius: 18px; border: 1px solid #2A3452; background: #0D111C; color: #F4F4F5; font: 400 15px/1.45 Inter, sans-serif; padding: 12px 14px; outline: none">Close thunder crack, rolling off into the distance over the sea</textarea>
    </div>

    <div style="display: flex; padding: 4px; border-radius: 22px; background: #0D111C; border: 1px solid #2A3452">
      <button style="flex-grow: 1; height: 40px; border-radius: 18px; border: 0; background: transparent; color: #A9B4CC; font: 500 14px Inter, sans-serif; cursor: pointer">Loop</button>
      <button aria-pressed="true" style="flex-grow: 1; height: 40px; border-radius: 18px; border: 0; background: #F4F4F5; color: #0A0A0C; font: 600 14px Inter, sans-serif; cursor: pointer">One-shot</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 14px"><label for="dur">Length</label><span style="color: #A9B4CC; font-variant-numeric: tabular-nums">4.0s</span></div>
      <input id="dur" type="range" min="0.5" max="22" step="0.5" value="4" style="width: 100%; height: 28px; margin: 0">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 14px"><label for="infl">Follow my prompt</label><span style="color: #A9B4CC; font-variant-numeric: tabular-nums">0.6</span></div>
      <input id="infl" type="range" min="0" max="1" step="0.1" value="0.6" style="width: 100%; height: 28px; margin: 0">
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #8E9AB3"><span>More creative</span><span>More literal</span></div>
    </div>

    <div style="flex-grow: 1"></div>

    <div style="display: flex; gap: 10px">
      <button style="height: 54px; padding: 0 18px; border-radius: 27px; border: 1px solid #4A2A36; background: transparent; color: #FF8FA3; font: 600 15px Inter, sans-serif; cursor: pointer">Delete</button>
      <button style="flex-grow: 1; height: 54px; border-radius: 27px; border: 0; background: #F4F4F5; color: #0A0A0C; font: 600 16px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
