<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Foley — Generating pads</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0C}
a{color:#F4F4F5}a:hover{color:#FFFFFF}
@keyframes breathe{0%,100%{transform:scale(.86);border-radius:46% 54% 52% 48%}33%{transform:scale(1.02);border-radius:56% 44% 48% 52%}66%{transform:scale(.94);border-radius:48% 52% 58% 42%}}
@keyframes shimmer{0%{opacity:.45}50%{opacity:1}100%{opacity:.45}}
@keyframes fly{0%{transform:translate(0,0) rotate(-4deg)}100%{transform:translate(-6px,-10px) rotate(2deg)}}
</style>

</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 60% at 50% 0%, #15213D 0%, #0B0F1A 60%); color: #F4F4F5; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 62px 20px 28px; overflow: hidden; position: relative">
  <div style="display: flex; align-items: center; gap: 12px">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #243150; background: rgba(20,28,48,0.8); color: #F4F4F5; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: -0.02em">Pirate ship in a storm</span>
      <span style="font-size: 13px; color: #A9B4CC">Building 3 of 6 sounds…</span>
    </div>
  </div>
  <div style="height: 4px; border-radius: 2px; background: #1C2740; overflow: hidden"><div style="width: 50%; height: 4px; border-radius: 2px; background: #F4F4F5"></div></div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; position: relative">
    <div style="height: 168px; border-radius: 28px; background: #121A2C; border: 1px solid #2A3654; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden">
      <div style="position: absolute; right: -18px; top: -18px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle at 36% 34%, #FFD9A0 0%, #FFB547 35%, #8A4E10 75%); box-shadow: 0 0 40px rgba(255,181,71,0.35)"></div>
      <span style="width: 28px; height: 28px; border-radius: 14px; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; position: relative"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F4F4F5" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px; position: relative"><span style="font-weight: 600; font-size: 15px">Creaking hull</span><span style="font-size: 12px; color: #A9B4CC">Loop · 10s</span></span>
    </div>
    <div style="height: 168px; border-radius: 28px; background: #121A2C; border: 1px solid #2A3654; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden">
      <div style="position: absolute; right: -18px; top: -18px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle at 36% 34%, #DCE8FF 0%, #8FB8FF 35%, #2A4AA8 75%); box-shadow: 0 0 40px rgba(143,184,255,0.35)"></div>
      <span style="width: 28px; height: 28px; border-radius: 14px; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; position: relative"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F4F4F5" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px; position: relative"><span style="font-weight: 600; font-size: 15px">Thunder crack</span><span style="font-size: 12px; color: #A9B4CC">One-shot · 4s</span></span>
    </div>
    <div style="height: 168px; border-radius: 28px; background: rgba(18,26,44,0.6); border: 1px solid #22304D; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; position: relative; overflow: hidden">
      <div style="position: absolute; left: 44px; top: 18px; width: 82px; height: 82px; background: radial-gradient(circle at 40% 38%, #A6F2E7 0%, #5EE0CF 40%, rgba(30,156,140,0.2) 80%); filter: blur(6px); animation: breathe 3.2s ease-in-out infinite"></div>
      <span></span>
      <span style="display: flex; flex-direction: column; gap: 2px; position: relative"><span style="font-weight: 600; font-size: 15px">Heavy rain</span><span style="font-size: 12px; color: #A9B4CC; animation: shimmer 1.6s ease-in-out infinite">Generating…</span></span>
    </div>
    <div style="height: 168px; border-radius: 28px; background: rgba(18,26,44,0.6); border: 1px solid #22304D; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden">
      <div style="position: absolute; left: 50px; top: 24px; width: 70px; height: 70px; background: radial-gradient(circle at 40% 38%, #E2D8FF 0%, #C2AEFF 40%, rgba(123,91,224,0.2) 80%); filter: blur(7px); animation: breathe 3.6s ease-in-out infinite .4s"></div>
      <span></span>
      <span style="display: flex; flex-direction: column; gap: 2px; position: relative"><span style="font-weight: 600; font-size: 15px">Howling wind</span><span style="font-size: 12px; color: #A9B4CC; animation: shimmer 1.6s ease-in-out infinite .3s">Generating…</span></span>
    </div>
    <div style="height: 168px; border-radius: 28px; background: transparent; border: 1.5px dashed #2E3B5C; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden">
      <div style="position: absolute; left: 66px; top: 40px; width: 38px; height: 38px; background: radial-gradient(circle, rgba(127,214,255,0.7) 0%, rgba(44,143,194,0.1) 80%); filter: blur(5px); animation: breathe 2.8s ease-in-out infinite"></div>
      <span></span>
      <span style="display: flex; flex-direction: column; gap: 2px; position: relative"><span style="font-weight: 600; font-size: 15px; color: #C9D2E3">Waves on hull</span><span style="font-size: 12px; color: #8E9AB3">Queued</span></span>
    </div>
    <div style="height: 168px; border-radius: 28px; background: rgba(60,20,32,0.35); border: 1px solid #5A2A3A; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; position: relative">
      <span style="width: 28px; height: 28px; border-radius: 14px; background: rgba(255,120,140,0.16); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF8FA3" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6M12 17h.01"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 8px">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 15px">Grumpy cat</span><span style="font-size: 12px; color: #E3B3BF">Couldn't make this one</span></span>
        <button style="height: 32px; align-self: flex-start; padding: 0 14px; border-radius: 16px; border: 0; background: #F4F4F5; color: #0A0A0C; font: 600 13px Inter, sans-serif; cursor: pointer">Retry</button>
      </span>
    </div>

    <span style="position: absolute; left: 196px; top: 196px; height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(194,174,255,0.2); border: 1px solid #C2AEFF; color: #F4F4F5; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; box-shadow: 0 10px 30px rgba(123,91,224,0.45); animation: fly 1.2s ease-in-out infinite alternate">howling wind</span>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="padding: 16px 18px; border-radius: 22px; background: rgba(15,22,38,0.8); border: 1px solid #1F2A44; font-size: 15px; line-height: 1.6; color: #8E9AB3">
    A <span style="border-bottom: 1.5px dotted #4A5878; padding: 0 22px"></span> in a <span style="border-bottom: 1.5px dotted #4A5878; padding: 0 30px"></span>, <span style="border-bottom: 1.5px dotted #4A5878; padding: 0 24px"></span>, <span style="background: rgba(194,174,255,0.16); color: #C9BCFF; border-radius: 5px; padding: 0 3px; opacity: .5">howling wind</span>, <span style="background: rgba(127,214,255,0.16); color: #BFE9FF; border-radius: 5px; padding: 0 3px">waves</span> smashing the hull and a <span style="background: rgba(255,163,192,0.16); color: #FFC9D8; border-radius: 5px; padding: 0 3px">grumpy cat</span> below deck
  </div>
</div>
</body>
</html>
