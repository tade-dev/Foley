name = "foley-proxy"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
OPENAI_MODEL = "gpt-4o-mini"

# Daily spend counters. A Durable Object, not KV: KV is eventually consistent, so concurrent
# requests lose increments and the caps come out several times looser than they read.
[[durable_objects.bindings]]
name = "SPEND"
class_name = "SpendCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpendCounter"]

# Burst protection, 20 requests per 60s per device.
[[unsafe.bindings]]
name = "BURST"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
