name = "foley-proxy"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
OPENAI_MODEL = "gpt-4o-mini"

# Daily counters. Create with: npx wrangler kv namespace create COUNTERS
# then paste the printed id below.
[[kv_namespaces]]
binding = "COUNTERS"
id = "2d4d27774aa04aa8a8e4b334be8c06d3"

# Burst protection, 20 requests per 60s per device.
[[unsafe.bindings]]
name = "BURST"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
